font_family       Roboto Mono Medium Nerd Font Complete Mono
bold_font         Roboto Mono Bold Nerd Font Complete Mono
italic_font       Roboto Mono Italic Nerd Font Complete Mono
bold_italic_font  Roboto Mono Bold Italic Nerd Font Complete Mono
font_size 11.0
symbol_map U+1F525 JoyPixels
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0
shell fish --login --interactive
exe_search_path +/opt/homebrew/bin
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
enabled_layouts splits,stack
map super+enter       launch --location=vsplit --cwd=current
map super+shift+enter launch --location=hsplit --cwd=current
map super+h neighboring_window left
map super+j neighboring_window down
map super+k neighboring_window up
map super+l neighboring_window right
map super+w close_window
include current-theme.conf
